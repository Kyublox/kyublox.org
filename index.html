<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kyublox Multiplayer Obby</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* UI OVERLAYS */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #logo { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 260px; max-width: 50%; pointer-events: auto; }
        
        /* CHAT SYSTEM */
        #chat-container { position: absolute; top: 20px; left: 20px; width: 300px; height: 220px; display: flex; flex-direction: column; pointer-events: auto; z-index: 100; }
        #chat-messages { flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.4); color: white; padding: 10px; border-radius: 8px 8px 0 0; text-shadow: 1px 1px 0 #000; font-size: 14px; }
        #chat-input { width: 100%; padding: 8px; border: none; background: rgba(0,0,0,0.7); color: white; border-radius: 0 0 8px 8px; outline: none; box-sizing: border-box; }
        
        /* MULTIPLAYER STATUS */
        #mp-status { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); color: #fff; padding: 10px; border-radius: 8px; text-align: right; pointer-events: auto; font-size: 14px; }
        #mp-status a { color: #00ff00; text-decoration: none; font-weight: bold; word-wrap: break-word; }
        
        /* MOBILE TOUCH CONTROLS */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; display: none; }
        #joystick-knob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%; pointer-events: none; }
        #jump-btn { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 3px solid #fff; color: white; font-weight: bold; font-size: 16px; align-items: center; justify-content: center; pointer-events: auto; user-select: none; display: none; }

        /* DESKTOP HINTS */
        #controls-hint { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); color: white; text-shadow: 1px 1px 0 #000; text-align: center; font-size: 14px; pointer-events: none; }

        @media (max-width: 768px) {
            #joystick-zone, #jump-btn { display: flex; }
            #controls-hint { display: none; }
            #chat-container { top: 80px; width: 200px; height: 150px; }
            #mp-status { top: 80px; max-width: 150px; font-size: 12px; }
            #logo { width: 160px; top: 10px; }
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <img id="logo" src="KyuBlox Logo.png" alt="KyuBlox Logo" onerror="this.style.display='none'">
    
    <div id="chat-container">
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Click here to chat...">
    </div>
    
    <div id="mp-status">Connecting to Kyublox Multiplayer...</div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="jump-btn">JUMP</div>

    <div id="controls-hint">
        <b>WASD / Arrows</b> to Move | <b>Space</b> to Jump<br>
        <b>Right-Click + Drag</b> to Orbit Camera | <b>Scroll</b> to Zoom
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>
// --- THREE.JS SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(20, 50, 20);
dirLight.castShadow = true;
scene.add(dirLight);

// --- R6 RIG GENERATOR ---
function createR6Rig(colors) {
    const group = new THREE.Group();
    const matHead = new THREE.MeshStandardMaterial({color: colors.head || 0xf1c27d});
    const matTorso = new THREE.MeshStandardMaterial({color: colors.torso || 0x0055ff});
    const matLimbs = new THREE.MeshStandardMaterial({color: colors.limbs || 0xa4cc70});
    
    const head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), matHead);
    head.position.y = 1.5; head.castShadow = true; group.add(head);
    
    const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), matTorso);
    torso.position.y = 0; torso.castShadow = true; group.add(torso);
    
    const lArmPivot = new THREE.Group(); lArmPivot.position.set(-1.5, 1, 0);
    const lArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), matLimbs);
    lArm.position.y = -1; lArm.castShadow = true; lArmPivot.add(lArm); group.add(lArmPivot);
    
    const rArmPivot = new THREE.Group(); rArmPivot.position.set(1.5, 1, 0);
    const rArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), matLimbs);
    rArm.position.y = -1; rArm.castShadow = true; rArmPivot.add(rArm); group.add(rArmPivot);
    
    const lLegPivot = new THREE.Group(); lLegPivot.position.set(-0.5, -1, 0);
    const lLeg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), matLimbs);
    lLeg.position.y = -1; lLeg.castShadow = true; lLegPivot.add(lLeg); group.add(lLegPivot);
    
    const rLegPivot = new THREE.Group(); rLegPivot.position.set(0.5, -1, 0);
    const rLeg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), matLimbs);
    rLeg.position.y = -1; rLeg.castShadow = true; rLegPivot.add(rLeg); group.add(rLegPivot);
    
    group.position.y = 3; 
    return { group, lArmPivot, rArmPivot, lLegPivot, rLegPivot };
}

const myPlayer = createR6Rig({torso: 0x0055ff, limbs: 0xa4cc70});
scene.add(myPlayer.group);

// --- PHYSICS & INPUT ---
const GRAVITY = -0.015;
const JUMP_FORCE = 0.35;
const SPEED = 0.18;
let velocityY = 0;
let isGrounded = false;

const input = { forward:0, right:0, jump:false };
const keys = {};
let isChatFocused = false;

// --- CAMERA CONTROLS ---
let camDist = 12;
let camYaw = 0;
let camPitch = -0.2;
let isDragging = false;
let lastMouseX = 0, lastMouseY = 0;

window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousedown', e => { if(e.button === 2) isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
window.addEventListener('mouseup', e => { if(e.button === 2) isDragging = false; });
window.addEventListener('mousemove', e => {
    if(isDragging) {
        camYaw -= (e.clientX - lastMouseX) * 0.005;
        camPitch -= (e.clientY - lastMouseY) * 0.005;
        camPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, camPitch));
        lastMouseX = e.clientX; lastMouseY = e.clientY;
    }
});
window.addEventListener('wheel', e => { camDist += e.deltaY * 0.02; camDist = Math.max(4, Math.min(30, camDist)); });

// Keyboard
window.addEventListener('keydown', e => { if(!isChatFocused) keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Mobile Touch
const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyCenter = {x:0, y:0};
let touchId = null;

joyZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    touchId = touch.identifier;
    const rect = joyZone.getBoundingClientRect();
    joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
    updateJoy(touch);
}, {passive: false});
joyZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === touchId) updateJoy(e.changedTouches[i]);
}, {passive: false});
joyZone.addEventListener('touchend', e => {
    e.preventDefault();
    for(let i=0; i<e.changedTouches.length; i++) {
        if(e.changedTouches[i].identifier === touchId) {
            touchId = null; input.forward = 0; input.right = 0;
            joyKnob.style.transform = `translate(0px, 0px)`;
        }
    }
});
function updateJoy(touch) {
    let dx = touch.clientX - joyCenter.x;
    let dy = touch.clientY - joyCenter.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    let maxDist = 40;
    if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    input.right = dx / maxDist;
    input.forward = -dy / maxDist;
}

const jumpBtn = document.getElementById('jump-btn');
jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); input.jump = true; }, {passive:false});
jumpBtn.addEventListener('touchend', e => { e.preventDefault(); input.jump = false; }, {passive:false});

// --- OBBY MAP GENERATOR ---
const platforms = [];
const killParts = [];
function addPart(x, y, z, w, h, d, color, isKill = false) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({color}));
    mesh.position.set(x, y, z); mesh.receiveShadow = true; mesh.castShadow = true;
    scene.add(mesh);
    const box = new THREE.Box3().setFromObject(mesh);
    if(isKill) killParts.push(box); else platforms.push(box);
}

// Map Layout
addPart(0, -1, 0, 12, 2, 12, 0x33aa33); // Spawn
addPart(0, 1, -15, 5, 1, 5, 0xffffff);  // Jump 1
addPart(0, 3, -25, 4, 1, 4, 0xffaa00);  // Jump 2
addPart(10, 4, -25, 4, 1, 4, 0xffaa00); // Jump 3
addPart(22, 1, -25, 10, 1, 10, 0xff0000, true); // Lava kill brick!
addPart(22, 6, -25, 3, 1, 3, 0xffffff); // Safe block over lava
addPart(35, 7, -25, 6, 1, 6, 0x00ff00); // End Checkpoint

function resetPlayer() {
    myPlayer.group.position.set(0, 3, 0);
    velocityY = 0;
}

// --- MULTIPLAYER & CHAT ---
const otherPlayers = {}; 
const chatMsgs = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const mpStatus = document.getElementById('mp-status');

chatInput.addEventListener('focus', () => isChatFocused = true);
chatInput.addEventListener('blur', () => isChatFocused = false);

function addChat(name, text) {
    const d = document.createElement('div');
    d.innerHTML = `<b>${name}:</b> ${text}`;
    chatMsgs.appendChild(d);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

chatInput.addEventListener('keypress', e => {
    if(e.key === 'Enter' && chatInput.value.trim() !== '') {
        const msg = chatInput.value.trim();
        addChat('Me', msg);
        broadcast({type: 'chat', msg: msg});
        chatInput.value = '';
        chatInput.blur();
    }
});

let peer, myId, conn;
const connections = []; 
const urlParams = new URLSearchParams(window.location.search);
const joinId = urlParams.get('join');

peer = new Peer(); 
peer.on('open', id => {
    myId = id;
    if(joinId) {
        mpStatus.innerText = "Joining Host...";
        conn = peer.connect(joinId);
        setupConn(conn);
    } else {
        const link = window.location.origin + window.location.pathname + '?join=' + id;
        mpStatus.innerHTML = `You are the Host!<br>Share link: <a href="${link}" target="_blank">Invite Friends</a>`;
    }
});
peer.on('connection', newConn => {
    connections.push(newConn);
    setupConn(newConn);
});
peer.on('error', err => {
    mpStatus.innerHTML = `<span style="color:red">Server Error. Playing Offline.</span>`;
});

function setupConn(c) {
    c.on('open', () => { if(joinId) mpStatus.innerText = "Connected to Server!"; });
    c.on('data', data => {
        if(!joinId) broadcast(data); // If Host, relay to others
        if(data.type === 'chat') addChat(data.id.substring(0,5), data.msg);
        if(data.type === 'pos' && data.id !== myId) {
            if(!otherPlayers[data.id]) {
                otherPlayers[data.id] = createR6Rig({torso: Math.random() * 0xffffff, limbs: 0xcccccc});
                scene.add(otherPlayers[data.id].group);
            }
            // Smoothly move remote players
            otherPlayers[data.id].group.position.lerp(new THREE.Vector3(data.pos.x, data.pos.y, data.pos.z), 0.4);
            otherPlayers[data.id].group.rotation.y = data.rot;
            animateRig(otherPlayers[data.id], data.animTime, data.isMoving, data.isGrounded);
        }
    });
    c.on('close', () => {
        if(otherPlayers[c.peer]) { scene.remove(otherPlayers[c.peer].group); delete otherPlayers[c.peer]; }
    });
}

function broadcast(data) {
    if(!data.id) data.id = myId;
    if(joinId && conn && conn.open) { 
        conn.send(data); 
    } else { 
        connections.forEach(c => { if(c.open && c.peer !== data.id) c.send(data); }); 
    }
}

// --- ANIMATION & MAIN LOOP ---
const clock = new THREE.Clock();
let animTime = 0;
let lastSync = 0;

function animateRig(rig, t, moving, grounded) {
    if(!grounded) {
        rig.lArmPivot.rotation.x = Math.PI; rig.rArmPivot.rotation.x = Math.PI;
        rig.lLegPivot.rotation.x = -0.2; rig.rLegPivot.rotation.x = 0.2;
    } else if(moving) {
        rig.lArmPivot.rotation.x = Math.sin(t * 15) * 1.5;
        rig.rArmPivot.rotation.x = Math.sin(t * 15 + Math.PI) * 1.5;
        rig.lLegPivot.rotation.x = Math.sin(t * 15 + Math.PI) * 1.5;
        rig.rLegPivot.rotation.x = Math.sin(t * 15) * 1.5;
        rig.group.position.y += Math.sin(t * 30) * 0.05; // Walk bobbing
    } else {
        rig.lArmPivot.rotation.x = 0; rig.rArmPivot.rotation.x = 0;
        rig.lLegPivot.rotation.x = 0; rig.rLegPivot.rotation.x = 0;
        rig.group.position.y += Math.sin(t * 2) * 0.03; // Idle breathing
    }
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    animTime += dt;
    
    // Mix Desktop + Mobile Input
    let fwd = input.forward, rgt = input.right, jmp = input.jump;
    if(!isChatFocused) {
        if(keys['KeyW'] || keys['ArrowUp']) fwd += 1;
        if(keys['KeyS'] || keys['ArrowDown']) fwd -= 1;
        if(keys['KeyD'] || keys['ArrowRight']) rgt += 1;
        if(keys['KeyA'] || keys['ArrowLeft']) rgt -= 1;
        if(keys['Space']) jmp = true;
    }

    const isMoving = Math.abs(fwd) > 0.1 || Math.abs(rgt) > 0.1;
    if(isMoving) {
        const inputAngle = Math.atan2(rgt, fwd);
        const moveAngle = camYaw + inputAngle;
        myPlayer.group.position.x += Math.sin(moveAngle) * SPEED;
        myPlayer.group.position.z += -Math.cos(moveAngle) * SPEED;
        
        let rotDiff = moveAngle - myPlayer.group.rotation.y;
        while(rotDiff > Math.PI) rotDiff -= Math.PI * 2;
        while(rotDiff < -Math.PI) rotDiff += Math.PI * 2;
        myPlayer.group.rotation.y += rotDiff * 0.2;
    }

    velocityY += GRAVITY;
    myPlayer.group.position.y += velocityY;
    
    // Custom Box Collision Engine
    const playerBox = new THREE.Box3();
    playerBox.setFromCenterAndSize(
        new THREE.Vector3(myPlayer.group.position.x, myPlayer.group.position.y - 0.5, myPlayer.group.position.z),
        new THREE.Vector3(2, 5, 2)
    );
    
    isGrounded = false;
    for(let kp of killParts) if(kp.intersectsBox(playerBox)) { resetPlayer(); break; }
    
    for(let plat of platforms) {
        if(plat.intersectsBox(playerBox) && velocityY < 0 && playerBox.min.y > plat.max.y - 1.2) {
            myPlayer.group.position.y = plat.max.y + 3;
            velocityY = 0;
            isGrounded = true;
        }
    }
    
    if(myPlayer.group.position.y < -30) resetPlayer();
    if(jmp && isGrounded) velocityY = JUMP_FORCE;

    animateRig(myPlayer, animTime, isMoving, isGrounded);

    // Orbit Camera Math
    const camTarget = myPlayer.group.position.clone();
    camTarget.y += 1; // Focus near head
    camera.position.x = camTarget.x - Math.sin(camYaw) * Math.cos(camPitch) * camDist;
    camera.position.y = camTarget.y - Math.sin(camPitch) * camDist;
    camera.position.z = camTarget.z - Math.cos(camYaw) * Math.cos(camPitch) * camDist;
    camera.lookAt(camTarget);

    // Network Broadcasting (~10 frames a second)
    if(animTime - lastSync > 0.1) {
        lastSync = animTime;
        broadcast({ type: 'pos', pos: myPlayer.group.position, rot: myPlayer.group.rotation.y, animTime, isMoving, isGrounded });
    }

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
